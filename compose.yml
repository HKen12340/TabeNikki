services:
  app:
    container_name: app
    build: ./docker/php
    volumes:
      - .:/var/www
    working_dir: /var/www/laravel-project
    depends_on:
      - mailhog
    networks:
      - app_net

  nginx:
    image: nginx
    container_name: nginx
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    working_dir: /var/www
    depends_on:
      - app
    networks:
      - app_net

  mailhog:
      image: mailhog/mailhog:latest
      container_name: mailhog
      ports:
          - ${FORWARD_MAILHOG_PORT:-1025}:1025
          - ${FORWARD_MAILHOG_DASHBOARD_PORT:-8025}:8025
      networks:
          - app_net

  mysql:
    image: mysql:5.7
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: LaravelTest
      MYSQL_USER: db-user
      MYSQL_PASSWORD: db-pass
      TZ: 'Asia/Tokyo'
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./docker/db/data:/var/lib/mysql
      - ./docker/db/my.cnf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/db/sql:/docker-entrypoint-initdb.d
    networks:
      app_net:
        aliases:
          - mysql
          
  queue:
    build: ./docker/php
    container_name: queue-worker
    volumes:
      - .:/var/www
    working_dir: /var/www/laravel-project
    command: php artisan queue:work --sleep=3 --tries=3
    depends_on:
      - app
      - mysql
    restart: unless-stopped
    networks:
      - app_net

  scheduler:
    build: ./docker/php
    container_name: scheduler-worker
    volumes:
      - .:/var/www
    working_dir: /var/www/laravel-project
    command: sh -c "while true;do php artisan schedule:run;sleep 60; done"
    depends_on:
      - app
      - mysql
    networks:
      - app_net

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./docker/qdrant_data:/qdrant/data
    networks:
      - app_net
      
networks:
  app_net:
    driver: bridge
